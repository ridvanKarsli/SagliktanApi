# Production profili - Railway'de SPRING_PROFILES_ACTIVE=prod set edilince
# devreye girer. Amac: her SQL sorgusunu loglayan gurultuyu ve gereksiz
# performans yukunu kapatmak. Lokal gelistirmede show-sql=true kalmasi icin
# bu dosya sadece prod profilinde okunuyor, application.properties'i degistirmiyor.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn
