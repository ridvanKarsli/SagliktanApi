spring.application.name=SagliktanApi

# Render gibi platformlar konteynere PORT env degiskeniyle dinlenecek portu
# soyluyor; lokalde PORT tanimli olmadigi icin 8080'de kalir.
server.port=${PORT:8080}

# Gercek sirlar (DB sifresi, JWT secret, email adresi/sifresi) application-secrets.properties
# dosyasinda tutuluyor - o dosya .gitignore'da, repoya girmiyor. Ilk kurulumda
# application-secrets.properties.example'i application-secrets.properties olarak
# kopyalayip kendi degerlerini gir.
spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/sagliktan
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Railway Postgres (Hobby) baglanti limiti sinirli - havuzu kucuk ve sinirli
# tutuyoruz ki tek instance bile tum baglantilari tuketmesin. Idle/max-lifetime
# degerleri Postgres tarafinin baglantiyi sessizce kapatmasindan once bizim
# geri vermemizi saglar.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SagliktanHikariPool

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# E-posta gonderimi @Async calisiyor (AsyncConfig) - varsayilan Spring Boot
# executor'u sinirsiz kuyruga sahip, kucuk ama acik sinirlar koyuyoruz ki
# beklenmedik bir spam/abuse durumunda bellek/thread patlamasin.
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=async-

# Doğrulama mailindeki linkin gidecegi adres - production'da gercek domain'e degismeli
app.base-url=http://localhost:8080

# CORS + WebSocket izin verilen origin listesi (virgülle ayrılmış). Varsayilan
# prod origin'leri - bu deger degistirilmedigi surece davranis eskisiyle ayni.
# Staging/dev ortami (Railway'de develop branch'ini izleyen ayri servis) kendi
# ALLOWED_ORIGINS env degiskeninde Vercel preview domain'ini de ekleyecek,
# boylece prod kodu/davranisi hic etkilenmeden ayri bir ortamda test edilebiliyor.
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://sagliktan.com,https://www.sagliktan.com,http://localhost:3000}

# Hata izleme (Sentry). DSN gizli bir deger degil (Sentry'nin kendi
# dokumantasyonuna gore public/client-side kodda bile gorunebilir), ama
# lokal gelistirmede test hatalarinin prod Sentry projesine karismasini
# istemiyoruz - bu yuzden varsayilan bos birakiliyor (bos DSN = SDK kendini
# otomatik devre disi birakir), gercek deger sadece Railway'de SENTRY_DSN
# env degiskeniyle set ediliyor. send-default-pii bilerek KAPALI (varsayilan
# false) - KVKK hukuki incelemesi tamamlanana kadar kullanici IP/header gibi
# verileri ucuncu tarafa (Sentry) gondermiyoruz, sadece hata/stack trace.
sentry.dsn=${SENTRY_DSN:}

# JWT (secret icin app.jwt.secret'a bkz. application-secrets.properties)
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# Resend (transactional e-posta - bkz. ResendEmailService). Ikisi de bos/
# varsayilan degerle calisiyor ki key set edilmemis bir ortamda (ör. CI -
# orada zaten app.testing.auto-verify-email=true oldugu icin hic
# cagrilmiyor) uygulama basarisiz olmadan ayaga kalksin. Gercek deger
# Railway'de RESEND_API_KEY env degiskeniyle set ediliyor - repoya girmiyor.
resend.api-key=${RESEND_API_KEY:}
# sagliktan.com Resend'de domain olarak dogrulanana kadar test adresi
# (onboarding@resend.dev) kullanilir - bkz. ResendEmailService yorumu.
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Faz 2 adım 4: Cloudflare R2 (S3 uyumlu) medya depolama. Beşi de boş
# varsayılanla tanımlı - env değişkenleri set edilmemişse (ör. henüz
# kurulmamış bir ortamda) uygulama YİNE DE ayağa kalkar, sadece medya
# yükleme uçları çağrıldığında 503 döner (bkz. MediaStorageServiceImpl.
# isConfigured/@PostConstruct) - JWT secret gibi diğer sırların aksine
# bilerek fail-fast yapılmadı, çünkü bu tamamen opsiyonel bir alt özellik,
# eksikliği tüm API'yi ayağa kalkamaz hale getirmemeli.
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.endpoint=${R2_ENDPOINT:}
app.r2.bucket=${R2_BUCKET:}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# Swagger / OpenAPI (rapor adim 11) - asagidakiler zaten springdoc varsayilani,
# aciklik olsun diye elle yazildi
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# Actuator: sadece health ve info disariya aciliyor - env/beans/configprops gibi
# sir sizdirabilecek endpoint'ler kapali. Railway health check /actuator/health'i
# cagiriyor (bkz. SecurityConfig - bu tek yol public), digerleri authenticated.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# NOT: eskiden burada management.health.mail.enabled=false vardi -
# spring-boot-starter-mail (SMTP) Actuator'a otomatik bir "mail" health
# indicator ekliyordu ve bu, Gmail'de gecici bir sorun oldugunda health'i
# gereksiz yere DOWN'a dusurebiliyordu (bkz. Resend'e gecis öncesi not).
# Resend REST API uzerinden calistigi ve spring-boot-starter-mail artik
# classpath'te olmadigi icin bu indicator hic eklenmiyor - property'e gerek
# kalmadi.
