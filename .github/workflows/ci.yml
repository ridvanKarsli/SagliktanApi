name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Flyway migration'ları ve @SpringBootTest gerçek bir Postgres bağlantısı
    # gerektiriyor (ddl-auto=validate, H2/Testcontainers kullanılmıyor).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sagliktan
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # application-secrets.properties repoya girmiyor (.gitignore), bu
      # yüzden CI'da gereken değerler ortam değişkeni olarak veriliyor.
      # Bunlar sadece CI'da kullanılan, gerçek prod sırlarıyla ilgisi
      # olmayan test değerleridir.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sagliktan
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_JWT_SECRET: Y2ktb25seS10ZXN0LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Q9
      EMAIL_SENDER: ci-test@example.com
      EMAIL_PASSWORD: ci-test-password
      APP_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B clean verify
